<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b6e69"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>マスター過去問演習</title></head>
<body><div class="app-shell"><header class="topbar"><button class="brand" type="button" data-page="home"><span class="brand-mark">M</span><span>マスター過去問演習</span></button><button class="icon-button" id="install-button" type="button" title="ホーム画面に追加" hidden>⇩</button></header><main>
<section class="page active" id="home-page"><div class="welcome"><p class="eyebrow">PAST EXAM PRACTICE</p><h1>過去問を、<br>一問ずつ確かめる。</h1><p>不動産証券化マスター Course1</p></div><button class="primary-action" type="button" data-page="years"><strong>年度から始める</strong><span>2025年度から選択</span></button><div class="home-actions"><button class="action-tile amber" type="button" data-action="mistakes"><strong>間違いを復習</strong><span id="mistake-count">0 問</span></button><button class="action-tile" type="button" data-page="history"><strong>学習履歴</strong><span>正答率を確認</span></button></div><section class="progress-strip"><div><p class="eyebrow">LEARNING PROGRESS</p><p class="progress-value"><span id="answered-count">0</span> <small>問に取り組みました</small></p></div><div class="rate-wrap"><span id="correct-rate">--</span><small>正答率</small></div></section></section>
<section class="page" id="years-page"><div class="page-head"><button class="text-button" type="button" data-page="home">‹ ホーム</button><h1>年度を選ぶ</h1></div><p class="muted">新しい年度から順に表示しています。</p><div class="year-list" id="year-list"></div></section>
<section class="page" id="categories-page"><div class="page-head"><button class="text-button" type="button" data-page="years">‹ 年度</button><h1 id="categories-title">分野を選ぶ</h1></div><p class="muted">分野を選んで、順番またはランダムに出題できます。</p><div class="category-list" id="category-list"></div></section>
<section class="page" id="mode-page"><div class="page-head"><button class="text-button" type="button" data-page="categories">‹ 分野</button><h1>出題方法</h1></div><div class="mode-summary" id="mode-summary"></div><div class="mode-actions"><button class="primary-action" type="button" data-mode="sequential"><strong>順番に出題</strong><span>問題番号順に取り組む</span></button><button class="action-tile" type="button" data-mode="random"><strong>ランダムに出題</strong><span>問題の順番をシャッフル</span></button></div></section>
<section class="page" id="quiz-page"><div class="quiz-toolbar"><button class="text-button" type="button" data-page="home">‹ 中断する</button><span id="quiz-position"></span></div><div class="quiz-meta"><span class="category-badge" id="question-category"></span><span id="question-year"></span></div><article class="question-area"><h1>問題</h1><div class="rich-content" id="question-content"></div></article><div class="options" id="options"></div><section class="result-panel" id="result-panel" hidden><p class="result-title" id="result-title"></p><p class="correct-answer" id="correct-answer"></p><div class="exam-context" id="exam-context"></div><p class="explanation-label">解説</p><div class="rich-content" id="explanation-content"></div></section><button class="solid-button" id="answer-button" type="button" disabled>回答する</button><button class="solid-button" id="next-button" type="button" hidden>次の問題へ</button></section>
<section class="page" id="history-page"><div class="page-head"><button class="text-button" type="button" data-page="home">‹ ホーム</button><h1>学習履歴</h1></div><div class="stats-grid"><div><span id="history-total">0</span><small>回答数</small></div><div><span id="history-correct">--</span><small>正答率</small></div><div><span id="history-mistakes">0</span><small>復習待ち</small></div></div><section class="history-section"><h2>年度別の正答率</h2><div class="stat-list" id="year-stats"></div></section><button class="danger-button" id="clear-history" type="button">学習履歴を消去</button></section>
</main></div><script type="module" src="app.js"></script></body></html>
